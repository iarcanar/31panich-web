  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <!-- 3 -->
  <text x="22" y="45" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="800" fill="#f1f2f2" text-anchor="middle" letter-spacing="-1">3</text>
  <!-- 1 -->
