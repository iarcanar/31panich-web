<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#adffad"/>
      <stop offset="1" stop-color="#3b31bb"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <rect x="4" y="4" width="172" height="172" rx="36" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <!-- 3 -->
  <text x="62" y="124" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="800" fill="#f1f2f2" text-anchor="middle" letter-spacing="-2">3</text>
  <!-- 1 -->
  <text x="124" y="124" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-2">1</text>
</svg>
